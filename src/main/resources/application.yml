spring:
  application:
    name: team-agent
  ai:
    openai:
      # DeepSeek 兼容 OpenAI 协议：把 base-url 指向 DeepSeek 即可
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.2
  datasource:
    url: jdbc:mysql://127.0.0.1:3308/team_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    hikari:
      maximum-pool-size: 10

server:
  port: 8090

logging:
  level:
    org.springframework.ai: DEBUG
