<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能组队助手 (流式版)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { width: 400px; padding: 8px; }
        button { padding: 8px 16px; }
        #out { white-space: pre-wrap; margin-top: 20px; padding: 15px; border: 1px solid #ccc; min-height: 100px; background: #f9f9f9; }
    </style>
</head>
<body>
<h2>智能组队助手 (SSE 流式输出)</h2>
<input id="q" placeholder="如：找会 Java 的大三队友，每周至少 4 天" value="找会 Java 的大三队友，每周至少 4 天">
<button id="send">发送</button>
<div id="out">等待提问...</div>

<script>
    let source = null;
    let t0 = 0, last = 0, first = true; // 新增：用于计时

    document.getElementById('send').onclick = () => {
        if (source) source.close();

        const query = document.getElementById('q').value;
        const out = document.getElementById('out');
        out.textContent = '思考中...';

        // 初始化前端秒表
        t0 = performance.now();
        last = t0;
        first = true;

        source = new EventSource('/recommend/stream?query=' + encodeURIComponent(query));

        source.onmessage = (e) => {
            const now = performance.now();
            if (first) {
                console.log(`[METRIC] 前端 TTFB: ${(now - t0).toFixed(0)} ms`);
                first = false;
            } else {
                console.log(`[METRIC] 前端 chunk 间隔: ${(now - last).toFixed(0)} ms`);
            }
            last = now;

            if (out.textContent === '思考中...') out.textContent = '';
            out.textContent += e.data;
        };

        source.onerror = () => {
            source.close();
            document.getElementById('send').disabled = false;
        };

        document.getElementById('send').disabled = true;
    };
</script>
</body>
</html>
