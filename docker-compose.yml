services:
  mysql:
    image: mysql:8.0
    container_name: team-agent-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: team_agent
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - team-agent-mysql-data:/var/lib/mysql

volumes:
  team-agent-mysql-data: